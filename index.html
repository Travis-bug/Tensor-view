<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic 3D Tensor Builder</title>


    <link rel="stylesheet" href="src/style.css">

</head>

<body>
<div id="welcome" aria-hidden="true">
    <h1 class="welcome-title">WELCOME</h1>
    <p class="welcome-thanks">Thanks for checking out my project</p>
</div>

<button id="menu-toggle" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">
    <span></span><span></span><span></span>
</button>

<div id="sidebar">
    <h2>Tensor Map Builder</h2>

    <form id="add-form">
        <div class="form-group">
            <input type="text" id="doer" required placeholder="Doer (e.g., P1)">
        </div>
        <div class="form-group">
            <input type="text" id="action" required placeholder="Action (e.g., Slap)">
        </div>
        <div class="form-group">
            <input type="text" id="receiver" required placeholder="Receiver (e.g., P2)">
        </div>
        <button type="submit">Add to Map</button>
    </form>

    <button id="clear-btn">Clear All Data</button>

    <div id="legend">
        <h3>Action Legend</h3>
        <div id="legend-content"></div>
    </div>

    <div>
        <h3 style="display: flex; justify-content: space-between;">
            <span>Node</span>
            <span style="font-size: 12px; font-weight: normal; color: #aaa; padding-top: 4px;">Grid Layer</span>
        </h3>
        <div id="data-list"></div>
    </div>
</div>

<div id="canvas-container"></div>

<!-- Browsers can't resolve bare "three" imports on their own (GitHub Pages has no bundler), so map them to a CDN -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
}
</script>
<script type="module" src="src/main.js"></script>
</body>

</html>
